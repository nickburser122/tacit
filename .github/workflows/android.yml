name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build, test, lint
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --continue 2>&1 | tee build.log

      - name: Device tests compile
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --stacktrace --continue 2>&1 | tee build-androidtest.log

      - name: Release build
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --continue 2>&1 | tee build-release.log

      - name: Benchmark module
        if: always()
        run: |
          set -o pipefail
          ./gradlew :benchmark:assembleBenchmark --stacktrace --continue 2>&1 | tee build-benchmark.log

      - name: Show errors
        if: failure()
        run: |
          for f in build.log build-androidtest.log build-release.log build-benchmark.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -nE '^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Could not|AssertionError|expected|at app\.tacit|Test|> ' "$f" | grep -v 'Task :' | head -60
          done > errors.txt || true
          msg=$(head -c 30000 errors.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::$msg"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build*.log
            app/build/reports/**
            app/build/test-results/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacit-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
